<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Board</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Theme Color -->
    <meta name="theme-color" content="#0f3460">

    <!-- iOS Spezifisch - WICHTIG für iPhone! -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fitness Board">

    <!-- Apple Touch Icons - MEHRERE GRÖSSEN -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-512.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-512.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-512.png">
    <link rel="apple-touch-icon" href="/icons/icon-512.png">

    <!-- Standard Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-192.png">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Navigation -->
<nav class="navbar">
    <div class="nav-brand">💪 Fitness Board</div>
    <div class="nav-menu">
        <button class="nav-btn active" data-view="workouts">🏆 Workouts</button>
        <button class="nav-btn" data-view="training">🏋️‍♂️ Training</button>
        <button class="nav-btn" data-view="timer">⏱️ Timer</button>
        <button class="nav-btn" data-view="recovery">💤 Regeneration</button>
        <button class="nav-btn" data-view="stats">📊 Statistiken</button>
        <button class="nav-btn" data-view="analysis">🧠 Analyse</button>
        <button class="nav-btn" data-view="settings">⚙️ Einstellungen</button>

    </div>
    <!-- Settings-Button ENTFERNT! -->
</nav>


<!-- Main Content -->
<main class="container">
    <!-- Workouts View -->
    <div id="workouts-view" class="view active">
        <div class="view-header">
            <h1>Meine Workouts</h1>
            <button class="btn btn-primary" id="createWorkoutBtn">+ Neues Workout</button>
        </div>
        <div id="workoutsList" class="workouts-grid"></div>
    </div>

    <!-- Training View -->
    <div id="training-view" class="view">
        <div class="view-header">
            <h1>Training</h1>
            <button class="btn btn-primary" id="todayTrainingBtn">Heute trainieren</button>
        </div>
        <div id="trainingContent"></div>
    </div>

    <!-- Timer View -->
    <div id="timer-view" class="view">
        <div class="view-header">
            <h1>⏱️ Timer</h1>
        </div>

        <div class="timer-container">
            <!-- Timer-Tabs -->
            <div class="timer-tabs">
                <button class="timer-tab active" data-mode="countdown">
                    ⏱️ Countdown
                </button>
                <button class="timer-tab" data-mode="stopwatch">
                    ⏲️ Stoppuhr
                </button>
                <button class="timer-tab" data-mode="interval">
                    🔄 Intervall
                </button>
            </div>

            <!-- Timer-Display -->
            <div class="timer-display" id="timerDisplay">
                01:00
            </div>

            <!-- Timer-Controls -->
            <div class="timer-controls" id="timerControls">
                <!-- Wird dynamisch gefüllt -->
            </div>

            <!-- Timer-Presets -->
            <div class="timer-presets" id="timerPresets">
                <!-- Wird dynamisch gefüllt -->
            </div>
        </div>
    </div>

    <!-- Recovery View -->
    <div id="recovery-view" class="view">
        <div class="view-header">
            <h1>🔄 Regeneration</h1>
        </div>

        <!-- Recovery Score -->
        <div class="recovery-score-card">
            <div class="score-circle" id="recoveryScoreCircle">
                <div class="score-value" id="recoveryScoreValue">--</div>
                <div class="score-label">Regeneration</div>
            </div>
            <div class="score-status" id="recoveryStatus">Wird berechnet...</div>
        </div>

        <!-- Stats Grid -->
        <div class="recovery-stats">
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-value" id="consecutiveDays">0</div>
                <div class="stat-label">Tage in Folge</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📉</div>
                <div class="stat-value" id="weeksSinceDeload">0</div>
                <div class="stat-label">Wochen seit Deload</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💪</div>
                <div class="stat-value" id="weeklyVolume">0</div>
                <div class="stat-label">Wöchentliches Volumen</div>
            </div>
        </div>

        <!-- Recommendations -->
        <div class="recommendations-section">
            <h3>💡 Empfehlungen</h3>
            <div id="recommendationsList" class="recommendations-list">
                <!-- Wird dynamisch gefüllt -->
            </div>
        </div>

        <!-- Deload Button -->
        <div class="deload-section">
            <button class="btn btn-primary" id="markDeloadBtn">
                📉 Deload-Woche markieren
            </button>
        </div>
    </div>

    <!-- Stats View -->
    <div id="stats-view" class="view">
        <div class="view-header">
            <h1>📊 Statistiken</h1>
            <div class="stats-period">
                <button class="period-btn active" data-period="week">Woche</button>
                <button class="period-btn" data-period="month">Monat</button>
                <button class="period-btn" data-period="all">Gesamt</button>
            </div>
        </div>
        <div id="statsContent" class="stats-grid"></div>
    </div>

    <!-- Analysis View - NEU! HIER EINFÜGEN! -->
    <div id="analysis-view" class="view">
        <div class="view-header">
            <h1>🧠 Trainingsanalyse</h1>
        </div>
        <div id="analysisContent"></div>
    </div>

    <!-- Settings View - NEU! HIER EINFÜGEN! -->
    <div id="settings-view" class="view">
        <div class="view-header">
            <h1>⚙️ Einstellungen</h1>
        </div>
        <div id="settingsContent"></div>
    </div>


</main>

<!-- Modals -->
<div id="modalOverlay" class="modal-overlay"></div>
<div id="modalContainer"></div>

<!-- Scripts -->
<script type="module" src="js/app.js"></script>
</body>
</html>
